<!DOCTYPE html>
<html lang="ko" data-theme="game">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kera — Portfolio</title>
<meta name="description" content="게임 개발자이자 연구자이자 동네 개발자, Kera의 포트폴리오">
<!-- 손글씨 폰트(포스트잇용). 로드에 실패해도 기본 손글씨체로 보입니다. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" media="print" onload="this.media='all'">
<style>
/* =========================================================
   공통
   ========================================================= */
:root{
  --ui:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --mono:ui-monospace,"D2Coding","SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--fg);font-family:var(--body);
  line-height:1.65;min-height:100vh;
  word-break:keep-all;overflow-wrap:break-word;
  transition:background .35s ease,color .35s ease;
}
a{color:var(--accent);text-underline-offset:3px}
img{max-width:100%}
#app{padding:84px 20px 40px;transition:opacity .18s ease,transform .18s ease}
#app.swap{opacity:0;transform:translateY(6px)}
.wrap{max-width:var(--maxw);margin:0 auto}
footer{text-align:center;padding:28px 16px 40px;font-size:13px;color:var(--muted)}

/* 왼쪽 상단 전환 버튼 — 알약 모양 + 옆으로 미끄러지는 하이라이트 */
.switcher{
  position:fixed;top:14px;left:14px;z-index:70;display:flex;padding:4px;isolation:isolate;
  background:var(--sw-bg);border:1px solid var(--sw-border);border-radius:999px;
  backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:0 6px 24px rgba(0,0,0,.18);
}
.switcher .thumb{
  position:absolute;z-index:0;top:4px;bottom:4px;left:0;width:0;border-radius:999px;
  background:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.28);
  transition:transform .5s cubic-bezier(.34,1.4,.5,1),width .5s cubic-bezier(.34,1.4,.5,1),background .35s;
}
.switcher button{
  position:relative;z-index:1;font:600 13px/1 var(--ui);padding:10px 16px;border:0;background:transparent;
  color:var(--sw-fg);cursor:pointer;border-radius:999px;white-space:nowrap;transition:color .25s,opacity .2s;
}
.switcher button:not([aria-pressed="true"]):hover{opacity:.7}
.switcher button[aria-pressed="true"]{color:var(--on-accent)}
.switcher button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:480px){.switcher{left:10px;top:10px}.switcher button{padding:9px 11px;font-size:12px}}

.chip{display:inline-block;font-size:12.5px;padding:3px 10px;border-radius:var(--chip-r);border:1px solid var(--border);color:var(--muted);margin:0 6px 6px 0}
.btn{display:inline-block;text-decoration:none;font-weight:700;font-size:14px;padding:10px 18px;border-radius:var(--btn-r);margin:0 10px 10px 0;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{border:1.5px solid var(--accent);color:var(--accent)}
.sec{margin-top:64px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important;animation:none!important}}

/* =========================================================
   테마 1 — GAME DEVELOPER · 모험가 길드 (카운터에서 바라본 길드 내부)
   ========================================================= */
html[data-theme="game"]{
  --bg:#f6e6c4;--fg:#3a2a1a;--muted:#7a5c3a;--accent:#eaa937;--on-accent:#3a2208;
  --border:#a8743a;--maxw:1040px;--chip-r:3px;--btn-r:6px;
  --body:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --serif:"Noto Serif KR","Nanum Myeongjo","Iowan Old Style",Georgia,serif;
  --hand:"Gaegu","Nanum Pen Script","Segoe Print","Comic Sans MS",cursive;
  --sw-bg:rgba(255,246,224,.92);--sw-border:#a8743a;--sw-fg:#5a3a22;
  overflow:hidden;
}
html[data-theme="game"] #app{padding:0}
html[data-theme="game"] footer{display:none}

.viewport{
  position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;
  display:grid;place-items:center;
  background:linear-gradient(#e9c08a 0 55%,#c98f55 55%);
}
.stage{
  --s:calc(min(100vw,177.78vh)/100);--s:calc(min(100vw,177.78dvh)/100);
  position:relative;width:calc(var(--s)*100);aspect-ratio:16/9;transform-origin:0 0;
  transition:transform .75s cubic-bezier(.65,0,.35,1);
}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage>svg.scene{inset:auto;left:-25%;top:-22.222%;width:150%;height:144.444%}
.stage .ui{transition:opacity .3s}
.viewport.zooming .ui,.viewport.zooming .dlg{opacity:0;pointer-events:none}
.viewport.locked .stage,.viewport.locked .boardbtn{pointer-events:none}
.viewport.locked .bubble{pointer-events:auto}
.mote{animation:drift 7s ease-in-out infinite;transform-box:fill-box}
@keyframes drift{0%,100%{transform:translate(0,0);opacity:.15}50%{transform:translate(9px,-16px);opacity:.85}}
.flame{animation:flick 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{0%,100%{transform:scale(1,1)}40%{transform:scale(.92,1.08)}70%{transform:scale(1.05,.95)}}

/* 의뢰 게시판 (벽 클릭 영역) */
.hot{cursor:pointer;outline:none}
.hot .hl{fill:rgba(255,243,176,.16);stroke:#fff3b0;stroke-width:6;stroke-linejoin:round;opacity:0;transition:opacity .2s}
.hot:hover .hl,.hot:focus-visible .hl{opacity:1}
.hot .glow{fill:none;stroke:rgba(255,226,120,.95);stroke-width:5;stroke-linejoin:round;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.1}50%{opacity:.8}}
#rock{cursor:pointer;transition:filter .2s}
#rock:hover{filter:drop-shadow(0 0 10px rgba(255,236,150,.95))}

/* 게시판 가운데 "클릭" 나무 팻말 */
.hint{
  position:absolute;left:7.8%;top:31.6%;translate:-50% -50%;
  border:calc(var(--s)*.2) solid #5a3a22;border-radius:calc(var(--s)*.6);cursor:pointer;
  font:800 calc(var(--s)*1.05)/1 var(--body);color:#fff3d0;letter-spacing:.04em;white-space:nowrap;
  background:linear-gradient(#b5793f,#8f5a2b);padding:calc(var(--s)*.55) calc(var(--s)*1.2);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 calc(var(--s)*.3) 0 rgba(0,0,0,.25);
  animation:bob 2.4s ease-in-out infinite;
}
.hint::before,.hint::after{content:"";position:absolute;top:50%;width:calc(var(--s)*.45);height:calc(var(--s)*.45);margin-top:calc(var(--s)*-.225);border-radius:50%;background:#e8c46a;border:1px solid #5a3a22}
.hint::before{left:calc(var(--s)*.35)}.hint::after{right:calc(var(--s)*.35)}
.hint:hover{filter:brightness(1.1)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--s)*-.5))}}

/* 천장에 매달린 이름 간판 */
.plate{
  position:absolute;left:50%;top:3.4%;transform:translateX(-50%);width:28%;height:8.6%;
  display:flex;align-items:center;justify-content:space-between;gap:2%;padding:0 2%;
  background:linear-gradient(#f4d9a4,#e3b878);border:calc(var(--s)*.25) solid #5a3a22;border-radius:calc(var(--s)*.9);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 calc(var(--s)*.45) 0 rgba(0,0,0,.2);
}
.plate::before,.plate::after{content:"";position:absolute;bottom:100%;width:calc(var(--s)*.28);height:calc(var(--s)*3.4);background:repeating-linear-gradient(180deg,#6a4423 0 calc(var(--s)*.5),#4a2c12 calc(var(--s)*.5) calc(var(--s)*.7))}
.plate::before{left:12%}.plate::after{right:12%}
.plate .nm{font:800 calc(var(--s)*1.9) var(--serif);line-height:1;color:#4a2c12}
.plate .rl{display:block;font:600 calc(var(--s)*.85) var(--body);color:#7a5430;margin-top:.3em}
.plate .btns{display:flex;gap:calc(var(--s)*.5)}
.plate .btns a{
  text-decoration:none;font:700 calc(var(--s)*.9) var(--body);padding:calc(var(--s)*.45) calc(var(--s)*1);
  border-radius:999px;border:calc(var(--s)*.15) solid #2a3568;transition:transform .15s;
}
.plate .btns a:hover{transform:translateY(-2px)}
.plate .btns .p{background:#2a3568;color:#fff3d0}
.plate .btns .g{background:#fff8e6;color:#2a3568}
.boardbtn{display:none}

/* ---- 접수원 말풍선 (돌멩이 오른쪽 위) ---- */
.bubble{
  position:absolute;z-index:66;left:55.5%;bottom:69%;width:24%;cursor:pointer;
  padding:calc(var(--s)*1) calc(var(--s)*1.5) calc(var(--s)*1.5);
  background:#fff;color:#2a2f4a;border:calc(var(--s)*.22) solid #2a3568;border-radius:calc(var(--s)*1.7);
  font-size:calc(var(--s)*1.2);line-height:1.6;box-shadow:0 calc(var(--s)*.4) 0 rgba(42,53,104,.18);
  transform-origin:10% 100%;transition:opacity .35s,transform .35s;
}
.bubble.hidden{opacity:0;transform:scale(.85);pointer-events:none}
.bubble::after{
  content:"";position:absolute;left:9%;bottom:calc(var(--s)*-1);width:calc(var(--s)*1.9);height:calc(var(--s)*1.9);
  background:#fff;border-right:calc(var(--s)*.22) solid #2a3568;border-bottom:calc(var(--s)*.22) solid #2a3568;
  transform:rotate(45deg) skew(8deg,8deg);
}
.bubble .bname{display:block;font-weight:800;color:#2a3568;font-size:.8em;letter-spacing:.06em;margin-bottom:.15em}
.bubble .bt{min-height:1.6em;white-space:pre-wrap}
.bubble .nx{position:absolute;right:calc(var(--s)*1.1);bottom:calc(var(--s)*.55);width:0;height:0;border-left:calc(var(--s)*.45) solid transparent;border-right:calc(var(--s)*.45) solid transparent;border-top:calc(var(--s)*.6) solid #7a86c8;opacity:0}
.bubble.ready .nx{opacity:1;animation:nxb .9s ease-in-out infinite}
@keyframes nxb{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

/* ---- 방문자 대화창 (비주얼 노벨 스타일, 화면 아래) ---- */
.dlg{
  position:fixed;z-index:65;left:max(14px,calc(50% - 560px));right:max(14px,calc(50% - 560px));bottom:16px;
  min-height:120px;padding:28px 34px 22px;cursor:pointer;user-select:none;-webkit-user-select:none;
  background:linear-gradient(rgba(255,251,240,.97),rgba(252,241,215,.97));color:#3a2a1a;
  border:3px solid #5a3a22;border-radius:16px;box-shadow:0 10px 30px rgba(60,30,5,.35);
  font:17px/1.75 var(--body);transition:opacity .35s,transform .35s;
}
.dlg::before{content:"";position:absolute;inset:6px;border:2px solid #e0b44a;border-radius:11px;pointer-events:none}
.dlg.hidden{opacity:0;transform:translateY(24px);pointer-events:none}
.dlg .who{position:absolute;top:-19px;left:24px;background:#8a5a2f;color:#fff3d0;font:800 15px/1 var(--body);padding:9px 18px;border-radius:999px;border:3px solid #5a3a22;letter-spacing:.04em}
.dlg .txt{position:relative;min-height:1.75em;font-weight:600;color:#3a2a1a}
.dlg .txt.muted{font-weight:400;color:#a08a68;font-size:.94em}
.dlg.choosing .txt{display:none}
.dlg .skip{position:absolute;top:-15px;right:24px;display:none;font:700 12px var(--ui);background:#fff8e6;border:2px solid #a8743a;color:#7a5430;border-radius:999px;padding:4px 12px;cursor:pointer}
.dlg.skippable .skip{display:block}
.choices{position:relative;display:flex;flex-direction:column;gap:4px}
.choices:empty{display:none}
.choices button{
  position:relative;text-align:left;font:700 17px/1.4 var(--body);color:#2a3568;background:transparent;border:0;
  border-radius:10px;padding:8px 12px 8px 32px;cursor:pointer;animation:pop .3s both;
}
.choices button::before{content:"";position:absolute;left:12px;top:50%;margin-top:-6px;border-left:10px solid #c99a2e;border-top:6px solid transparent;border-bottom:6px solid transparent;transition:transform .2s}
.choices button:nth-child(2){animation-delay:.06s}.choices button:nth-child(3){animation-delay:.12s}
.choices button:hover,.choices button:focus-visible{background:rgba(42,53,104,.09);outline:none}
.choices button:hover::before{transform:translateX(4px)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 튜토리얼 스포트라이트 */
.spot{position:fixed;z-index:60;border-radius:16px;border:3px solid #fff3b0;pointer-events:none;
  box-shadow:0 0 0 200vmax rgba(25,14,5,.58),0 0 26px rgba(255,236,150,.85);transition:left .45s,top .45s,width .45s,height .45s}
body.tut .switcher{z-index:50}

/* ---- 길드 정면 (첫 화면) ---- */
.entry{position:fixed;inset:0;z-index:62;overflow:hidden;cursor:pointer;background:linear-gradient(#9ad4ff 0 50%,#cdb48a 50%);outline:none}
.estage{
  --s:calc(min(100vw,177.78vh)/100);--s:calc(min(100vw,177.78dvh)/100);
  position:absolute;left:50%;top:50%;translate:-50% -50%;width:calc(var(--s)*100);aspect-ratio:16/9;perspective:calc(var(--s)*90);
}
.estage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.elight,.dl,.dr{position:absolute;top:27.78%;height:64.44%}
.elight{left:38.125%;width:23.75%;border-radius:50% 50% 0 0/32.76% 32.76% 0 0;
  background:radial-gradient(ellipse at 50% 70%,#fff 0,#fff6c8 45%,#ffd36b 100%);opacity:0;transition:opacity .7s,box-shadow .9s}
.dl,.dr{
  width:11.875%;border:calc(var(--s)*.25) solid #5a3a22;transition:transform 1s cubic-bezier(.5,0,.3,1);
  background:
    linear-gradient(transparent 20%,#4b3b2e 20%,#4b3b2e 22.5%,transparent 22.5%,transparent 76%,#4b3b2e 76%,#4b3b2e 78.5%,transparent 78.5%),
    repeating-linear-gradient(90deg,#bd7c42 0 calc(var(--s)*2.6),#9a5f2c calc(var(--s)*2.6) calc(var(--s)*2.8));
  box-shadow:inset 0 0 calc(var(--s)*2) rgba(60,30,5,.35);
}
.dl{left:38.125%;transform-origin:0 50%;border-top-left-radius:100% 32.76%}
.dr{left:50%;transform-origin:100% 50%;border-top-right-radius:100% 32.76%}
.dl::after,.dr::after{content:"";position:absolute;top:55%;width:calc(var(--s)*2.2);height:calc(var(--s)*2.2);border:calc(var(--s)*.45) solid #e0b44a;border-radius:50%}
.dl::after{right:9%}.dr::after{left:9%}
.entry:not(.opening):hover .dl{transform:rotateY(-7deg)}
.entry:not(.opening):hover .dr{transform:rotateY(7deg)}
.entry:not(.opening):hover .elight{opacity:.55}
.entry.opening .dl{transform:rotateY(-110deg)}
.entry.opening .dr{transform:rotateY(110deg)}
.entry.opening .elight{opacity:1;box-shadow:0 0 calc(var(--s)*14) calc(var(--s)*8) rgba(255,240,180,.95)}
.ehint{
  position:absolute;left:50%;top:84%;translate:-50% -50%;white-space:nowrap;
  font:800 calc(var(--s)*1.25)/1 var(--body);color:#fff3d0;background:linear-gradient(#b5793f,#8f5a2b);
  border:calc(var(--s)*.22) solid #5a3a22;border-radius:999px;padding:calc(var(--s)*.8) calc(var(--s)*1.8);
  box-shadow:0 calc(var(--s)*.35) 0 rgba(0,0,0,.25);animation:bob 2.2s ease-in-out infinite;transition:opacity .3s
}
.entry.opening .ehint{opacity:0}
.gflash{position:fixed;inset:0;z-index:90;pointer-events:none;background:radial-gradient(circle at 50% 55%,#fffef6,#fff3c4 70%,#ffe39a);opacity:0;transition:opacity .55s ease}
.gflash.on{opacity:1}
.gflash.out{transition:opacity .9s ease}

/* ---- 의뢰 게시판 화면 (줌인 후) ---- */
.bv{position:fixed;inset:0;z-index:55;display:grid;place-items:center;padding:12px;background:rgba(40,25,10,0);transition:background .35s}
.bv.show{background:rgba(40,25,10,.58)}
.cork{
  --cw:min(980px,94vw,calc((90dvh - 110px)*1.6));
  position:relative;width:var(--cw);max-height:92vh;max-height:92dvh;overflow:auto;
  padding:20px 24px 26px;border:14px solid #8a5a2f;border-radius:14px;
  background-color:#dba763;
  background-image:radial-gradient(rgba(110,70,30,.35) 1.3px,transparent 1.8px),radial-gradient(rgba(255,240,205,.3) 1px,transparent 1.5px);
  background-size:11px 11px,17px 17px;background-position:0 0,5px 7px;
  box-shadow:inset 0 0 50px rgba(90,50,15,.45),0 20px 50px rgba(0,0,0,.5),0 0 0 3px #4d3019;
  opacity:0;transform:scale(.94);transition:opacity .3s,transform .35s cubic-bezier(.2,.9,.3,1.1);
}
.bv.show .cork{opacity:1;transform:none}
.bv-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.bv-back{cursor:pointer;font:700 14px var(--ui);background:#fff8e6;color:#4a2c12;border:2px solid #5a3a22;border-radius:999px;padding:8px 16px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.bv-back:hover{transform:translateY(-1px)}
.bv-sign{font:800 19px var(--serif);letter-spacing:.14em;color:#f9e7b5;background:linear-gradient(#6a4423,#4d3019);border:3px solid #2e1b0b;border-radius:6px;padding:8px 26px;box-shadow:0 5px 0 rgba(0,0,0,.3);text-align:center}
.bv-spacer{width:104px}
@media(max-width:560px){.bv-sign{font-size:14px;padding:6px 12px;letter-spacing:.06em}.bv-spacer{display:none}.cork{padding:16px 12px 20px;border-width:10px}}
.bv-area{position:relative;width:100%;aspect-ratio:16/10;--note:max(110px,calc(var(--cw)*.17))}

/* 표준 포스트잇: 모두 같은 정사각형, 드문드문 */
.pn{
  position:absolute;left:min(calc(var(--x)*1%),calc(100% - var(--note)));top:min(calc(var(--y)*1%),calc(100% - var(--note)));
  width:var(--note);height:var(--note);border:0;text-align:left;cursor:pointer;
  padding:calc(var(--note)*.2) calc(var(--note)*.11) calc(var(--note)*.08);
  background-color:var(--paper,#ffe97a);
  background-image:linear-gradient(180deg,rgba(255,255,255,.38),transparent 26%,transparent 80%,rgba(0,0,0,.09));
  color:#2c2417;font-family:var(--hand);
  transform:rotate(var(--rot,0deg));
  box-shadow:0 10px 12px -6px rgba(0,0,0,.5),0 2px 0 rgba(0,0,0,.08);
  transition:transform .22s cubic-bezier(.3,1.4,.5,1),box-shadow .22s;
}
.pn::before{
  content:"";position:absolute;top:calc(var(--note)*.05);left:50%;width:calc(var(--note)*.1);height:calc(var(--note)*.1);margin-left:calc(var(--note)*-.05);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffb3a6 0 12%,#e0412f 40%,#8f1d12 100%);box-shadow:0 2px 2px rgba(0,0,0,.4);
}
.pn:hover,.pn:focus-visible{transform:translateY(-8px) rotate(0) scale(1.07);box-shadow:0 20px 20px -10px rgba(0,0,0,.55);outline:none;z-index:2}
.pn:focus-visible{box-shadow:0 0 0 3px #fff,0 20px 20px -10px rgba(0,0,0,.55)}
.pn .ttl{display:block;font:700 calc(var(--note)*.145)/1.12 var(--hand);word-break:keep-all;overflow-wrap:normal;margin-top:calc(var(--note)*.04)}
.pn .tg{position:absolute;left:calc(var(--note)*.11);right:calc(var(--note)*.08);bottom:calc(var(--note)*.07);font:calc(var(--note)*.095)/1.2 var(--hand);color:#6a4b1e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 완료 도장 */
.done{
  position:absolute;left:50%;top:56%;width:58%;aspect-ratio:1;translate:-50% -50%;rotate:-16deg;
  display:grid;place-items:center;border-radius:50%;border:3px solid #c8281c;box-shadow:inset 0 0 0 4px rgba(255,255,255,.0),inset 0 0 0 6px #c8281c;
  color:#c8281c;font:800 calc(var(--note)*.15)/1 var(--serif);letter-spacing:.06em;opacity:.82;mix-blend-mode:multiply;pointer-events:none;
}
.done small{display:block;font-size:.5em;letter-spacing:.2em;margin-top:.2em}
/* 게시판의 빈 압정, 찢긴 종이 조각 */

const chips = arr => arr.map(t => `<span class="chip">${esc(t)}</span>`).join("");

/* =========================================================
   Game Developer — 모험가 길드 (정면 입구 → 내부)
   ========================================================= */
const lerp = (a, b, t) => a + (b - a) * t;
const wallMap = c => (u, v) => {
  const tx = lerp(c.a[0], c.b[0], u), ty = lerp(c.a[1], c.b[1], u);
  const bx = lerp(c.c[0], c.d[0], u), by = lerp(c.c[1], c.d[1], u);
  return [lerp(tx, bx, v), lerp(ty, by, v)];
};
const f1 = n => n.toFixed(1);
const ptsOf = a => a.map(p => f1(p[0]) + "," + f1(p[1])).join(" ");
const poly = (a, at) => `<polygon points="${ptsOf(a)}" ${at}/>`;
const seg = (a, b, at) => `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" ${at}/>`;
const quadOf = (M, u0, v0, u1, v1) => [M(u0, v0), M(u1, v0), M(u1, v1), M(u0, v1)];
// 입구에서 바라본 넓은 홀: 안쪽 벽(300~1300, 140~470), 눈높이 y=300
const Lw = wallMap({ a: [-400, -84], b: [300, 140], c: [-400, 708], d: [300, 470] });
const Rw = wallMap({ a: [2000, -84], b: [1300, 140], c: [2000, 708], d: [1300, 470] });
// 벽면에 평면 그림을 붙일 때 쓰는 변환 (벽 기울기에 맞춰 비틀기)
const onWall = (M, u, v, inner, sx = .8) => {
  const p = M(u, v), q = M(u + .01, v);
  const ang = Math.atan((q[1] - p[1]) / (q[0] - p[0])) * 180 / Math.PI;
  return `<g transform="translate(${f1(p[0])},${f1(p[1])}) skewY(${ang.toFixed(2)}) scale(${sx},1)">${inner}</g>`;

/* ---------- 내부 장면 (넓은 홀, 계단과 주방) ----------
   좌표: 화면에 보이는 영역은 x 0~1600, y 0~900.
   더 넓은 화면에서도 벽에 막히지 않도록 x -400~2000, y -200~1100까지 그려 둡니다. */
function sceneSVG() {
  let seed = 11;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const D = t => 300 + 170 * t;                    // 바닥 깊이(t) → 화면 y  (t=1: 안쪽 벽)
  const T = y => (y - 300) / 170;                  // 화면 y → 깊이 배율
  const M = 120;                                   // 안쪽 벽 기준 1m = 120
  // 천장까지 이어진 전체 옆벽 (높은 2층 홀)
  const LwF = [[-400,-516],[300,-40],[300,470],[-400,708]], RwF = [[2000,-516],[1300,-40],[1300,470],[2000,708]];
  let s = `<svg class="scene" viewBox="-400 -200 2400 1300" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="모험가 길드 내부">
  <defs>${sharedDefs}
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6c8" stop-opacity=".55"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></linearGradient>
    <radialGradient id="vig" cx=".5" cy=".42" r=".7"><stop offset=".62" stop-color="#5a3510" stop-opacity="0"/><stop offset="1" stop-color="#5a3510" stop-opacity=".22"/></radialGradient>
    <linearGradient id="ctop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5c98d"/><stop offset="1" stop-color="#dea563"/></linearGradient>
    <linearGradient id="cfront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a66d38"/><stop offset="1" stop-color="#7f5027"/></linearGradient>
    <linearGradient id="tabletop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0ba75"/><stop offset="1" stop-color="#d99a56"/></linearGradient>
    <linearGradient id="carpet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a73bd"/><stop offset="1" stop-color="#7c97df"/></linearGradient>
    <linearGradient id="kitchen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b3c1d"/><stop offset="1" stop-color="#8a5228"/></linearGradient>
    <linearGradient id="upper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9d2a4"/><stop offset="1" stop-color="#f3e2bd"/></linearGradient>
    <radialGradient id="fire"><stop offset="0" stop-color="#fff2a8"/><stop offset=".45" stop-color="#ffa53a"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
    <clipPath id="floorclip"><polygon points="300,470 1300,470 2000,708 2000,1100 -400,1100 -400,708"/></clipPath>
    <clipPath id="kclip"><path d="M1126,470 V330 A74,74 0 0 1 1274,330 V470 Z"/></clipPath>
  </defs><g transform="translate(800,300) scale(${VIEW_ZOOM}) translate(-800,-300)">`;

  /* ---------- 바닥 ---------- */
  s += `<g clip-path="url(#floorclip)"><rect x="-400" y="460" width="2400" height="640" fill="#d3995f"/>`;
  for (let xb = 300; xb <= 1300; xb += 34) s += `<line x1="${xb}" y1="470" x2="${f1(800 + (xb - 800) * 4.706)}" y2="1100" stroke="#bd8049" stroke-width="2"/>`;
  [1.05, 1.12, 1.21, 1.33, 1.48, 1.68, 1.95, 2.3, 2.8, 3.5].forEach((t, i) => s += `<line x1="-400" y1="${f1(D(t))}" x2="2000" y2="${f1(D(t))}" stroke="rgba(120,70,30,${.12 + i * .015})" stroke-width="2"/>`);
  s += `<polygon points="300,470 330,470 -330,708 -400,708" fill="rgba(90,50,20,.12)"/><polygon points="1300,470 1270,470 1930,708 2000,708" fill="rgba(90,50,20,.12)"/>`;
  s += `<polygon points="740,488 860,488 1060,1100 540,1100" fill="url(#carpet)"/>
        <polygon points="752,488 848,488 1020,1100 580,1100" fill="none" stroke="#f0c15a" stroke-width="5"/>
        <polygon points="760,488 840,488 995,1100 605,1100" fill="none" stroke="#f6dc8c" stroke-width="2"/>`;
  [[540, .75], [610, 1], [700, 1.3], [820, 1.75]].forEach(([y, k]) => s += `<path d="M800,${y - 12*k} l${22*k},${12*k} l${-22*k},${12*k} l${-22*k},${-12*k} Z" fill="#f0c15a" opacity=".85"/><circle cx="800" cy="${y}" r="${4.5*k}" fill="#5a73bd"/>`);
  s += `<polygon points="1126,470 1274,470 1340,540 1060,540" fill="#ffcf7a" opacity=".22"/></g>`;

  /* ---------- 벽 (2층까지 트인 높은 홀) ---------- */
  s += poly(LwF, 'fill="#ecd7ab"') + poly(RwF, 'fill="#f1deb6"');
  s += `<rect x="300" y="-200" width="1000" height="670" fill="#f6e7c6"/>`;
  for (let r = 0; r < 14; r++) {
    const y = -36 + r * 36; if (y + 32 > 392) break;
    const off = (r % 2) * 34;
    for (let x = 300 - off; x < 1300; x += 68) {
      const x0 = Math.max(303, x + 3), x1 = Math.min(1297, x + 65);
      if (x1 - x0 > 10) s += `<rect x="${x0}" y="${y}" width="${x1 - x0}" height="32" rx="7" fill="rgba(255,255,255,.16)" stroke="rgba(170,120,70,.16)" stroke-width="2"/>`;
    }
  }
  const bricks = Mp => {
    let o = "";
    for (let r = -26; r < 13; r++) {
      const v0 = r * .062 + .004, v1 = v0 + .054; if (v1 > .755) break;
      const off = ((r + 26) % 2) * .045;
      for (let u = .3 - off; u < 1; u += .09) {
        const u0 = Math.max(.3, u + .005), u1 = Math.min(.995, u + .085);
        if (u1 - u0 > .015) o += poly(quadOf(Mp, u0, v0, u1, v1), 'fill="rgba(255,255,255,.15)" stroke="rgba(170,120,70,.14)" stroke-width="2"');
      }
    }
    return o;
  };
  s += bricks(Lw) + bricks(Rw);
  s += poly(quadOf(Lw, 0, .76, 1, 1), 'fill="#c98f55"') + poly(quadOf(Rw, 0, .76, 1, 1), 'fill="#cf965c"');
  for (let u = .3; u < 1; u += .04) s += seg(Lw(u, .76), Lw(u, 1), 'stroke="#b07642" stroke-width="2"') + seg(Rw(u, .76), Rw(u, 1), 'stroke="#b47a45" stroke-width="2"');
  s += `<rect x="300" y="392" width="1000" height="78" fill="#d29a5f"/>`;
  for (let x = 330; x < 1300; x += 30) s += `<line x1="${x}" y1="392" x2="${x}" y2="470" stroke="#b97f45" stroke-width="2"/>`;
  s += `<line x1="300" y1="392" x2="1300" y2="392" stroke="#8a5a2f" stroke-width="6"/>`;
  s += seg(Lw(0,.76), Lw(1,.76), 'stroke="#8a5a2f" stroke-width="7"') + seg(Rw(0,.76), Rw(1,.76), 'stroke="#8a5a2f" stroke-width="7"');
  s += `<line x1="300" y1="-200" x2="300" y2="470" stroke="#c9a66a" stroke-width="4"/><line x1="1300" y1="-200" x2="1300" y2="470" stroke="#c9a66a" stroke-width="4"/>`;
  // 옆벽 높은 곳의 창문
  const highWin = (Mp, u0, u1) => {
    const P = [Mp(u0, .13), Mp(u0, -.08)];
    for (let k = 0; k <= 12; k++) { const t = Math.PI * k / 12, um = (u0 + u1) / 2, ur = (u1 - u0) / 2; P.push(Mp(um - ur * Math.cos(t), -.08 - .1 * Math.sin(t))); }
    P.push(Mp(u1, -.08), Mp(u1, .13));
    return poly(P, `fill="url(#sky)" stroke="#8a5a2f" stroke-width="7" stroke-linejoin="round"`) + seg(Mp((u0 + u1) / 2, -.18), Mp((u0 + u1) / 2, .13), 'stroke="#8a5a2f" stroke-width="4"');
  };
  s += highWin(Lw, .66, .8) + highWin(Rw, .66, .8);

  /* ---------- 2층 (안쪽 벽 위쪽) ---------- */
  s += `<rect x="300" y="-200" width="1000" height="396" fill="url(#upper)" opacity=".55"/>`;
  const door2 = x => `<rect x="${x - 40}" y="-30" width="80" height="226" rx="6" fill="#c9a66a" ${OL2}/><rect x="${x - 32}" y="-22" width="64" height="218" rx="4" fill="#9a5f2c" ${OL2}/>

/* ---------- 길드 정면 (첫 화면) ---------- */
function facadeSVG() {
  let s = `<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kera의 모험가 길드 정면">
  <defs>${sharedDefs}
    <linearGradient id="fsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fc0ff"/><stop offset="1" stop-color="#d6f0ff"/></linearGradient>
    <linearGradient id="fwin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c2"/><stop offset="1" stop-color="#ffc35e"/></linearGradient>
    <clipPath id="roofclip"><polygon points="30,104 1570,104 1490,-12 110,-12"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#fsky)"/>
  <g fill="#fff" opacity=".92"><ellipse cx="180" cy="70" rx="90" ry="24"/><ellipse cx="240" cy="56" rx="60" ry="26"/><ellipse cx="1400" cy="60" rx="100" ry="26"/><ellipse cx="1470" cy="46" rx="60" ry="24"/></g>`;
  // 벽 + 돌
  s += `<rect x="90" y="96" width="1420" height="744" fill="#ecd7ab" ${OL}/>`;
  for (let r = 0; r < 16; r++) {
    const y = 108 + r * 46; if (y + 40 > 836) break;
    const off = (r % 2) * 45;
    for (let x = 90 - off; x < 1510; x += 90) {
      const x0 = Math.max(94, x + 3), x1 = Math.min(1506, x + 87);
      if (x1 - x0 > 10) s += `<rect x="${x0}" y="${y}" width="${x1 - x0}" height="40" rx="8" fill="rgba(255,255,255,.17)" stroke="rgba(170,120,70,.17)" stroke-width="2"/>`;
    }
  }
  // 목재 골조
  s += `<rect x="90" y="96" width="28" height="744" fill="#8a5a2f" ${OL2}/><rect x="1482" y="96" width="28" height="744" fill="#8a5a2f" ${OL2}/>
        <rect x="440" y="96" width="22" height="744" fill="#8a5a2f" ${OL2}/><rect x="1138" y="96" width="22" height="744" fill="#8a5a2f" ${OL2}/>
        <rect x="90" y="300" width="1420" height="18" fill="#8a5a2f" ${OL2}/>
        <rect x="90" y="620" width="350" height="16" fill="#8a5a2f" ${OL2}/><rect x="1160" y="620" width="350" height="16" fill="#8a5a2f" ${OL2}/>`;
  // 지붕
  s += `<polygon points="30,104 1570,104 1490,-12 110,-12" fill="#c25e3f" ${OL}/><g clip-path="url(#roofclip)">`;
  [12, 38, 64, 90].forEach((y, r) => {
    const x0 = 110 - (y + 12) * .69, x1 = 1490 + (y + 12) * .69;
    s += `<line x1="${f1(x0)}" y1="${y}" x2="${f1(x1)}" y2="${y}" stroke="#93402a" stroke-width="2.5"/>`;
    for (let x = x0 + (r % 2) * 22; x < x1; x += 44) s += `<path d="M${f1(x)},${y - 26} q22,14 44,0" fill="none" stroke="#a54c31" stroke-width="2"/>`;
  });
  s += `</g><rect x="20" y="98" width="1560" height="16" rx="4" fill="#7a4a24" ${OL}/>`;
  // 창문 (따뜻한 불빛)
  const fwin = x => `<g transform="translate(${x},360)">
    <rect x="-34" y="0" width="30" height="210" rx="4" fill="#6f9fb8" ${OL2}/><rect x="184" y="0" width="30" height="210" rx="4" fill="#6f9fb8" ${OL2}/>
    ${[30, 70, 110, 150, 190].map(y => `<line x1="-30" y1="${y}" x2="-8" y2="${y}" stroke="#4f7d96" stroke-width="2"/><line x1="188" y1="${y}" x2="210" y2="${y}" stroke="#4f7d96" stroke-width="2"/>`).join("")}
    <rect x="0" y="0" width="180" height="210" rx="6" fill="#8a5a2f" ${OL}/><rect x="12" y="12" width="156" height="186" rx="4" fill="url(#fwin)" ${OL2}/>
    <line x1="90" y1="12" x2="90" y2="198" stroke="#8a5a2f" stroke-width="6"/><line x1="12" y1="104" x2="168" y2="104" stroke="#8a5a2f" stroke-width="6"/>
    <path d="M24,24 L70,24 L24,80 Z" fill="#fff" opacity=".35"/>
    <rect x="-14" y="206" width="208" height="30" rx="5" fill="#a86a38" ${OL}/>
    ${[10, 42, 74, 106, 138, 170].map((x, i) => `<ellipse cx="${x}" cy="200" rx="18" ry="12" fill="${i % 2 ? "#6fbf62" : "#7fcf6e"}" ${OL2}/><circle cx="${x + (i % 2 ? 4 : -3)}" cy="${192 - (i % 3) * 3}" r="7" fill="${["#ff8fb0", "#ffd44d", "#fff", "#ff8fb0", "#b3e2ff", "#ffd44d"][i]}" ${OL2}/>`).join("")}
  </g>`;
  s += fwin(200) + fwin(1220);
  // 간판
  s += `<line x1="560" y1="114" x2="560" y2="128" stroke="#5a3a22" stroke-width="4"/><line x1="1040" y1="114" x2="1040" y2="128" stroke="#5a3a22" stroke-width="4"/>
        <rect x="500" y="122" width="600" height="92" rx="16" fill="#a8693a" ${OL}/><rect x="512" y="134" width="576" height="68" rx="10" fill="none" stroke="#e0b44a" stroke-width="3"/>
        <text x="800" y="160" text-anchor="middle" font-family="Georgia,serif" font-size="17" letter-spacing="7" fill="#f6dc9c" font-weight="700">KERA'S</text>
        <text x="800" y="195" text-anchor="middle" font-family="Georgia,serif" font-weight="800" font-size="33" letter-spacing="5" fill="#ffe9b0">ADVENTURERS' GUILD</text>
        <path d="M530,168 l10,-10 l10,10 l-10,10 Z M1050,168 l10,-10 l10,10 l-10,10 Z" fill="#f0c15a" ${OL2}/>`;
  // 돌 아치 + 문 자리
  s += `<path d="M575,840 V440 A225,225 0 0 1 1025,440 V840 Z" fill="#d9c49a" ${OL}/>`;
  for (let k = 0; k <= 10; k++) {
    const a = Math.PI * k / 10, c = Math.cos(a), sn = Math.sin(a);
    s += `<line x1="${f1(800 - 190 * c)}" y1="${f1(440 - 190 * sn)}" x2="${f1(800 - 225 * c)}" y2="${f1(440 - 225 * sn)}" stroke="#b49a6c" stroke-width="3"/>`;
  }
  s += `<path d="M778,212 h44 l-6,34 h-32 Z" fill="#e8d6ae" ${OL2}/>`;
  s += `<path d="M610,840 V440 A190,190 0 0 1 990,440 V840 Z" fill="#3a2410" ${OL}/>`;
  // 벽 랜턴
  const wl = x => `<circle cx="${x}" cy="470" r="70" fill="url(#lg)"/><path d="M${x},420 h${x < 800 ? -30 : 30}" stroke="#5a3a22" stroke-width="5"/><rect x="${x < 800 ? x - 36 : x + 26}" y="404" width="10" height="34" rx="3" fill="#5a3a22"/>
    <path d="M${x-12},430 L${x},418 L${x+12},430 Z" fill="#5a4a3c" ${OL2}/><rect x="${x-14}" y="430" width="28" height="40" rx="5" fill="#fff1b8" ${OL2}/>
    <path class="flame" d="M${x},440 C${x-7},448 ${x-6},458 ${x},461 C${x+6},458 ${x+7},448 ${x},440 Z" fill="#ffa832"/><rect x="${x-16}" y="468" width="32" height="8" rx="3" fill="#5a4a3c" ${OL2}/>`;
  s += wl(530) + wl(1070);
  // 땅 + 계단
  s += `<rect x="0" y="840" width="1600" height="60" fill="#cdb48a"/>`;
  for (let r = 0; r < 3; r++) for (let x = -20 + (r % 2) * 30; x < 1620; x += 60) s += `<ellipse cx="${x}" cy="${852 + r * 18}" rx="26" ry="7" fill="#d8c29a" stroke="#b39a70" stroke-width="2"/>`;
  s += `<rect x="560" y="836" width="480" height="20" rx="3" fill="#c8b48e" ${OL2}/><rect x="540" y="856" width="520" height="22" rx="3" fill="#bfa982" ${OL2}/>`;
  // 소품: 화분, 통, 상자, 입간판
  s += at(510, 808, 1, plantP()) + at(1090, 808, 1, plantP());
  s += at(300, 792, 1, barrelP()) + at(368, 806, .8, barrelP());
  s += `<g transform="translate(1290,0)">${shadow(0, 842, 70, 8)}<rect x="-60" y="770" width="70" height="66" rx="4" fill="#c99252" ${OL}/><path d="M-60,770 L10,836 M10,770 L-60,836" stroke="#9a6233" stroke-width="3"/>
    <rect x="-2" y="790" width="56" height="46" rx="4" fill="#d8a063" ${OL}/><line x1="-2" y1="813" x2="54" y2="813" stroke="#9a6233" stroke-width="3"/></g>`;
  s += `<g transform="translate(1410,0)">${shadow(0, 842, 50, 7)}<path d="M-34,840 L-16,740 H16 L34,840" fill="none" stroke="#7a4a24" stroke-width="7" stroke-linecap="round"/>
    <rect x="-30" y="748" width="60" height="66" rx="5" fill="#3d4a3f" stroke="#7a4a24" stroke-width="5"/>
    <text x="0" y="777" text-anchor="middle" font-family="Georgia,serif" font-weight="800" font-size="15" fill="#f6f1df" letter-spacing="1.5">OPEN</text>
    <path d="M-16,792 h32 M-12,802 h24" stroke="#f6f1df" stroke-width="2" opacity=".6"/></g>`;
  s += `</svg>`;
  return s;
}

/* =========================================================
   Game Developer 화면 구성
   ========================================================= */
const G = { entered: false, entering: false };

function renderGame() {
  const plate = `<div class="plate ui">
      <div><div class="nm">${esc(DATA.name)}</div><span class="rl">${esc(DATA.headline.game)}</span></div>
      <div class="btns"><a class="p" href="${esc(DATA.github)}" target="_blank" rel="noopener">GitHub</a><a class="g" href="mailto:${esc(DATA.email)}">Contact</a></div>
    </div>`;
  const entry = G.entered ? "" : `<div class="entry" id="entry" role="button" tabindex="0" aria-label="길드 문을 열고 들어가기">
      <div class="estage">${facadeSVG()}<div class="elight"></div><div class="dl"></div><div class="dr"></div><div class="ehint">문을 눌러 들어가기</div></div>
    </div>`;
  return `<div class="viewport" id="viewport">
    <div class="stage" id="stage">
      ${sceneSVG()}
      <button type="button" class="hint ui" id="boardHint">의뢰 게시판 · 클릭!</button>
      <div class="bubble ui hidden" id="bub"><span class="bname">${esc(DATA.guild.receptionist)}</span><div class="bt" aria-live="polite"></div><span class="nx" aria-hidden="true"></span></div>
      ${plate}
    </div>
    <button type="button" class="boardbtn" id="boardBtn">의뢰 게시판 열기</button>
    <div class="dlg hidden" id="dlg">
      <span class="who">${esc(DATA.guild.visitor)}</span>
      <button type="button" class="skip">건너뛰기</button>
      <div class="txt muted"></div>
      <div class="choices"></div>
    </div>
    ${entry}
  </div>`;
}

/* ---------- 비주얼 노벨 대화 ---------- */
let dlgEl = null, txtEl = null, chEl = null, bubEl = null, btEl = null, typeTimer = 0, fullText = "", queue = [], onDone = null, curLine = null;
let spotEl = null, spotTarget = null, guildTimers = [];
const later = (fn, ms) => { const t = setTimeout(fn, ms); guildTimers.push(t); return t; };

function guildCleanup() {
  clearInterval(typeTimer); typeTimer = 0; queue = []; onDone = null; curLine = null;
  guildTimers.forEach(clearTimeout); guildTimers = [];
  setSpot(null); document.body.classList.remove("tut");
  document.querySelectorAll(".gflash").forEach(f => f.remove());
  G.entering = false; dlgEl = txtEl = chEl = bubEl = btEl = null;
}

function guildInit() {
  dlgEl = document.getElementById("dlg");
  txtEl = dlgEl.querySelector(".txt"); chEl = dlgEl.querySelector(".choices");
  bubEl = document.getElementById("bub"); btEl = bubEl.querySelector(".bt");
  dlgEl.addEventListener("click", e => { if (e.target.closest(".choices") || e.target.closest(".skip")) return; advance(); });
  bubEl.addEventListener("click", advance);
  dlgEl.querySelector(".skip").addEventListener("click", e => { e.stopPropagation(); skipAll(); });
  if (G.entered) { showTalk(); setReply(""); idle(); return; }
  const en = document.getElementById("entry");
  en.addEventListener("click", enterGuild);
  en.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); enterGuild(); } });
  requestAnimationFrame(() => en.focus({ preventScroll: true }));
}

function enterGuild() {
  if (G.entering || G.entered) return;
  const en = document.getElementById("entry");
  if (!en) return;
  G.entering = true;
  en.classList.add("opening");
  later(() => {
    const f = document.createElement("div");
    f.className = "gflash"; document.body.appendChild(f);
    requestAnimationFrame(() => f.classList.add("on"));
    later(() => {
      en.remove(); G.entered = true; G.entering = false;
      f.classList.add("out"); f.classList.remove("on");
      setTimeout(() => f.remove(), 950);
      later(welcome, 650);
    }, 600);
  }, 800);
}

function welcome() {
  const g = DATA.guild;
  showTalk(); setReply(""); dlgEl.classList.add("skippable");
  talk(g.welcome.map((t, i) => ({ text: t, auto: i === g.welcome.length - 1 })), () => choices([
    { label: g.ask, fn: tutorial },
    { label: "괜찮아요, 혼자 둘러볼게요.", fn: () => { dlgEl.classList.remove("skippable"); talk([{ text: "네! 궁금한 게 생기면 언제든 저를 눌러 주세요.", auto: true }], rest); } }
  ]));
}

function tutorial() {
  document.body.classList.add("tut");
  document.getElementById("viewport").classList.add("locked");
  dlgEl.classList.add("skippable");
  const steps = DATA.guild.tutorial;
  talk(steps.map((s, i) => ({ text: s.text, spot: s.target || null, auto: i === steps.length - 1 })), () => { endTutorial(); rest(); });
}
function endTutorial() {
  document.body.classList.remove("tut");
  const vp = document.getElementById("viewport"); if (vp) vp.classList.remove("locked");
  setSpot(null);
}
function skipAll() { clearInterval(typeTimer); typeTimer = 0; queue = []; onDone = null; endTutorial(); rest(); }

function idle(line) {
  if (!dlgEl) return;
  dlgEl.classList.remove("skippable");
  talk([{ text: line || DATA.guild.idle, auto: true }], () => choices([
    { label: "Kera는 어떤 사람인가요?", fn: about },
    { label: "의뢰 게시판을 보고 싶어요.", fn: () => talk([{ text: "네, 의뢰 게시판으로 안내해 드릴게요!", auto: true }], () => later(() => { idle(); openBoard(); }, 700)) },
    { label: "사용법을 다시 알려 주세요.", fn: tutorial },
    { label: "괜찮아요, 둘러볼게요.", fn: () => talk([{ text: "네! 필요하시면 언제든 저를 눌러 주세요.", auto: true }], rest) }
  ]));
}
// 대화 쉬기: 방문자 대화창은 내려가고, 접수원 말풍선도 잠시 뒤 사라짐 (접수원을 누르면 다시 시작)
let restTimer = 0;
function rest() {
  if (!dlgEl) return;
  clearChoices(); dlgEl.classList.remove("skippable"); dlgEl.classList.add("hidden");
  clearTimeout(restTimer);
  restTimer = later(() => { if (bubEl) bubEl.classList.add("hidden"); }, 3800);
}
function about() {
  talk([...DATA.guild.about.map(t => ({ text: t })), { text: `주로 쓰는 도구는 ${DATA.tools.join(", ")}이에요.` }], () => idle());
}
function rockTalk() {
  if (!G.entered || !dlgEl || document.body.classList.contains("tut") || boardState !== "closed") return;
  clearTimeout(restTimer); showTalk(); setReply("");
  idle("네, 부르셨나요? 무엇을 도와드릴까요?");
}

function talk(lines, done) { clearChoices(); queue = lines.slice(); onDone = done || null; next(); }
function next() {
  if (!queue.length) { const d = onDone; onDone = null; if (d) d(); return; }
  curLine = queue.shift();
  setSpot(curLine.spot || null);
  type(curLine.text);
}
function type(t) {
  fullText = t; let i = 0;
  btEl.textContent = ""; bubEl.classList.remove("ready");
  clearInterval(typeTimer);
  typeTimer = setInterval(() => { i++; btEl.textContent = fullText.slice(0, i); if (i >= fullText.length) finishType(); }, 28);
}
function finishType() {
  clearInterval(typeTimer); typeTimer = 0;
  btEl.textContent = fullText; bubEl.classList.add("ready");
  if (curLine && curLine.auto && !queue.length) next();
}
function advance() {
  if (!dlgEl || dlgEl.classList.contains("choosing")) return;
  if (typeTimer) { finishType(); return; }
  if (!queue.length && !onDone) return;
  next();
}
function choices(list) {
  clearChoices(); dlgEl.classList.add("choosing");
  list.forEach(c => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = c.label;
    b.addEventListener("click", e => { e.stopPropagation(); clearChoices(); setReply(c.label); later(c.fn, 380); });
    chEl.appendChild(b);
  });
}
// 접수원 말풍선과 방문자 대화창 보이기
function showTalk() { dlgEl.classList.remove("hidden"); bubEl.classList.remove("hidden"); }
// 아래 대화창에 방문자의 대답을 표시 (빈 값이면 안내 문구)
function setReply(t) {
  if (!txtEl) return;
  txtEl.classList.toggle("muted", !t);
  txtEl.textContent = t ? `“${t}”` : "말풍선을 눌러 대화를 이어가세요.";
}
function clearChoices() { if (chEl) chEl.innerHTML = ""; if (dlgEl) dlgEl.classList.remove("choosing"); }

/* ---------- 튜토리얼 스포트라이트 ---------- */
const SPOT_TARGETS = {
  switcher: () => document.querySelector(".switcher"),
  board: () => document.getElementById("boardHot"),
  plate: () => document.querySelector(".plate"),
  rock: () => document.getElementById("rock")
};
function setSpot(name) {
  spotTarget = name;
  if (!name || !SPOT_TARGETS[name]) { if (spotEl) { spotEl.remove(); spotEl = null; } return; }
  const el = SPOT_TARGETS[name]();
  if (!el) return;
  const vp = document.getElementById("viewport");
  if (vp && vp.contains(el) && vp.scrollWidth > vp.clientWidth && getComputedStyle(el).position !== "fixed") {
    const r = el.getBoundingClientRect();
    vp.scrollLeft += (r.left + r.width / 2) - innerWidth / 2;
  }
  const fresh = !spotEl;
  if (fresh) { spotEl = document.createElement("div"); spotEl.className = "spot"; spotEl.style.transition = "none"; document.body.appendChild(spotEl); }
  placeSpot();
  if (fresh) { void spotEl.offsetWidth; spotEl.style.transition = ""; }
}
function placeSpot() {
  if (!spotEl || !spotTarget) return;
  const el = SPOT_TARGETS[spotTarget](); if (!el) return;
  const r = el.getBoundingClientRect(), p = 10;
  Object.assign(spotEl.style, { left: (r.left - p) + "px", top: (r.top - p) + "px", width: (r.width + 2 * p) + "px", height: (r.height + 2 * p) + "px" });
}
window.addEventListener("resize", placeSpot);

/* ---- 의뢰 게시판 화면 ---- */
function boardHTML() {
  const notes = inView("game").map((p, k) => {
    const [x, y, r] = NOTE_POS[k % NOTE_POS.length];
    return `<button type="button" class="pn" data-proj="${k}" style="--x:${x};--y:${y};--rot:${r}deg;--paper:${PAPERS[k % 4]}">
      <span class="ttl">${esc(p.name)}</span>
      <span class="tg">${p.tags.slice(0, 2).map(t => "#" + esc(t)).join(" ")}</span>
      ${p.done ? `<span class="done">완료<small>CLEAR</small></span>` : ""}
    </button>`;
  }).join("");
  const extras = `
    <span class="cpin" style="left:40%;top:20%"></span>
    <span class="cpin r" style="left:86%;top:44%"></span>
    <span class="cpin" style="left:22%;top:86%"></span>
    <span class="scrap" style="left:70%;top:10%"><i></i></span>
    <span class="scrap" style="left:44%;top:84%;rotate:160deg"><i></i></span>`;
  return `<div class="cork" role="dialog" aria-modal="true" aria-label="의뢰 게시판">
    <div class="bv-head"><button type="button" class="bv-back">← 카운터로</button><div class="bv-sign">의뢰 게시판 · QUEST BOARD</div><span class="bv-spacer"></span></div>
    <div class="bv-area">${extras}${notes}</div>
  </div>`;
}

let boardEl = null, boardState = "closed", boardTimer = 0, cuEl = null, cuNote = null, lastFocus = null;

function openBoard() {
  if (boardState !== "closed") return;
  lastFocus = document.activeElement;
  const stage = document.getElementById("stage"), vp = document.getElementById("viewport");
  const portrait = matchMedia("(max-aspect-ratio: 1/1)").matches;
  if (portrait || !stage) { if (vp) vp.classList.add("zooming"); showBoard(); return; }
  const r = stage.getBoundingClientRect(), sc = r.width / 1600;
  const k = Math.min(4.5, .5 * innerWidth / (BOARD_W * sc));
  const tx = (innerWidth / 2 - r.left) - k * BOARD_C[0] * sc;
  const ty = (innerHeight / 2 - r.top) - k * BOARD_C[1] * sc;
  boardState = "opening";
  vp.classList.add("zooming");
  stage.style.transform = `translate(${tx}px,${ty}px) scale(${k})`;
  boardTimer = setTimeout(showBoard, 620);
}

function showBoard() {
  boardState = "open";
  boardEl = document.createElement("div");
  boardEl.className = "bv";
  boardEl.innerHTML = boardHTML();
  boardEl.addEventListener("click", e => {
    if (e.target === boardEl || e.target.closest(".bv-back")) { closeBoard(); return; }
    const n = e.target.closest("[data-proj]");
    if (n) openCloseup(Number(n.dataset.proj), n);
  });
  document.body.appendChild(boardEl);
  requestAnimationFrame(() => { boardEl.classList.add("show"); const b = boardEl.querySelector(".bv-back"); if (b) b.focus(); });
}

function closeBoard(instant) {
  clearTimeout(boardTimer);
  if (cuEl) closeCloseup(true);
  const el = boardEl; boardEl = null; boardState = "closed";
  const stage = document.getElementById("stage"), vp = document.getElementById("viewport");
  if (stage) stage.style.transform = "";
  if (vp) vp.classList.remove("zooming");
  if (el) { if (instant) el.remove(); else { el.classList.remove("show"); setTimeout(() => el.remove(), 320); } }
  if (!instant && lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

/* ---- 포스트잇 클로즈업 (눌러둔 포스트잇이 그대로 커짐) ---- */
function openCloseup(k, noteEl) {
  if (cuEl) return;
  const p = inView("game")[k];
  if (!p) return;
  const paras = (p.detail || "").split(/\n+/).filter(Boolean).map(t => `<p>${esc(t)}</p>`).join("");
  const rot = noteEl.style.getPropertyValue("--rot").trim() || "0deg";
  const paper = noteEl.style.getPropertyValue("--paper").trim() || PAPERS[0];
  const back = document.createElement("div");
  back.className = "cu-back";
  back.innerHTML = `<div class="cu" role="dialog" aria-modal="true" aria-label="${esc(p.name)} 상세" style="--paper:${paper}">
      <button type="button" class="x" aria-label="닫기">×</button>
      ${p.done ? `<span class="done">완료<small>CLEAR</small></span>` : ""}
      <h2>${esc(p.name)}</h2>
      <span class="st">${esc(p.status)}</span>
      <div class="tg">${p.tags.map(t => `<span>#${esc(t)}</span>`).join("")}</div>
      <p>${esc(p.summary)}</p>
      <h4>의뢰 상세 · DETAILS</h4>
      ${paras || `<p class="empty">상세 설명은 곧 채워질 예정이에요.</p>`}
      ${p.link ? `<a class="lk" href="${esc(p.link)}" target="_blank" rel="noopener">열어보기</a>` : ""}
    </div>`;
  back.addEventListener("click", e => { if (e.target === back || e.target.closest(".x")) closeCloseup(); });
  document.body.appendChild(back);
  const cu = back.querySelector(".cu");
  const r = noteEl.getBoundingClientRect(), f = cu.getBoundingClientRect();
  const dx = (r.left + r.width / 2) - (f.left + f.width / 2), dy = (r.top + r.height / 2) - (f.top + f.height / 2);
  cu.style.transition = "none";
  cu.style.transform = `translate(${dx}px,${dy}px) scale(${r.width / f.width}) rotate(${rot})`;
  noteEl.style.visibility = "hidden";
  void cu.offsetWidth;
  cu.style.transition = "";
  cuEl = back; cuNote = noteEl;
  requestAnimationFrame(() => { back.classList.add("show"); cu.style.transform = "none"; const x = cu.querySelector(".x"); if (x) x.focus(); });
}

function closeCloseup(instant) {
  if (!cuEl) return;
  const back = cuEl, note = cuNote; cuEl = null; cuNote = null;
  const cu = back.querySelector(".cu");
  const done = () => { back.remove(); if (note && document.contains(note)) { note.style.visibility = ""; if (!instant) note.focus(); } };
  if (instant || !note || !document.contains(note)) { done(); return; }
  const rot = note.style.getPropertyValue("--rot").trim() || "0deg";
  const r = note.getBoundingClientRect(), f = cu.getBoundingClientRect();
  const dx = (r.left + r.width / 2) - (f.left + f.width / 2), dy = (r.top + r.height / 2) - (f.top + f.height / 2);
  back.classList.remove("show");
  cu.style.transform = `translate(${dx}px,${dy}px) scale(${r.width / f.width}) rotate(${rot})`;
  setTimeout(done, 430);
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (cuEl) closeCloseup(); else if (boardState !== "closed") closeBoard(); }
});

  const projs = inView("research").map(p => `

      <p>${esc(p.summary)}</p><div style="margin-top:6px">${chips(p.tags)}</div>
      ${p.link ? `<p style="margin-top:2px;font:14px var(--sans)"><a href="${esc(p.link)}" target="_blank" rel="noopener">자료 보기 →</a></p>` : ""}</div></div>`).join("");
  const exp = DATA.experience.length
    ? `<section class="r-sec"><h2>Experience</h2>${rows(DATA.experience)}</section>` : "";
  return `<div class="wrap">

      <div class="r-contact">
        <a href="mailto:${esc(DATA.email)}">${esc(DATA.email)}</a>
        <a href="${esc(DATA.github)}" target="_blank" rel="noopener">${esc(DATA.github.replace("https://",""))}</a>

    ${DATA.summary.research ? `<section class="r-sec"><h2>Summary</h2><p>${esc(DATA.summary.research)}</p></section>` : ""}
    <section class="r-sec"><h2>Research Interests</h2><ul>${DATA.interests.map(i => `<li>${esc(i)}</li>`).join("")}</ul></section>
    <section class="r-sec"><h2>Education</h2>${rows(DATA.education)}</section>

    <section class="r-sec"><h2>Research</h2>${projs}</section>
    <section class="r-sec"><h2>Publications</h2><p>${esc(DATA.publications)}</p></section>
  </div>`;
}

/* =========================================================
   테마 전환
   ========================================================= */
const THEMES = {
  game:     { render: renderGame,     title: "Kera — Game Developer" },
  research: { render: renderResearch, title: "Kera — Researcher" },
  solo:     { render: renderSolo,     title: "Kera — Just Developer" }
};

const app = document.getElementById("app");
const sw = document.querySelector(".switcher");
const thumb = sw.querySelector(".thumb");
const buttons = sw.querySelectorAll("[data-theme-btn]");
let current = "game";

// 하이라이트(알약)를 선택된 버튼 위치로 미끄러지게 이동
function moveThumb(theme, animate) {
  const b = sw.querySelector(`[data-theme-btn="${theme}"]`);
  if (!b) return;
  if (!animate) thumb.style.transition = "none";
  thumb.style.width = b.offsetWidth + "px";
  thumb.style.transform = `translateX(${b.offsetLeft}px)`;
  if (!animate) { void thumb.offsetWidth; thumb.style.transition = ""; }
}

function paint(theme) {
  const t = THEMES[theme];
  closeBoard(true);
  guildCleanup();
  current = theme;
  document.documentElement.dataset.theme = theme;
  document.title = t.title;
  app.innerHTML = t.render();
  buttons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeBtn === theme)));
  if (theme === "game") {
    guildInit();
    // 세로 화면에서는 장면 가운데부터 보이게
    const centerStage = () => {
      const vp = document.getElementById("viewport"), st = document.getElementById("stage");
      if (vp && st) vp.scrollLeft = Math.max(0, (st.offsetWidth - vp.clientWidth) / 2);
    };
    requestAnimationFrame(() => { centerStage(); setTimeout(centerStage, 150); });
  }
}

function setTheme(theme, first) {
  if (!THEMES[theme]) theme = "game";
  try { localStorage.setItem("portfolio-theme", theme); } catch (e) {}
  if (first) { paint(theme); moveThumb(theme, false); return; }
  if (theme === current) return;
  try { history.replaceState(null, "", "#" + theme); } catch (e) {}
  moveThumb(theme, true);
  buttons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeBtn === theme)));
  app.classList.add("swap");
  setTimeout(() => { paint(theme); window.scrollTo({ top: 0 }); app.classList.remove("swap"); }, 180);
}

app.addEventListener("click", e => {
  if (e.target.closest("#boardHot") || e.target.closest("#boardBtn") || e.target.closest("#boardHint")) openBoard();
  else if (e.target.closest("#rock")) rockTalk();
});
app.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest("#boardHot")) { e.preventDefault(); openBoard(); }
});
buttons.forEach(b => b.addEventListener("click", () => setTheme(b.dataset.themeBtn)));
window.addEventListener("hashchange", () => setTheme(location.hash.slice(1)));
window.addEventListener("resize", () => moveThumb(current, false));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => moveThumb(current, false));

// 사이트에 들어오면 주소(#research 등)나 지난 방문 기록과 상관없이 항상 Game Developer(길드 입구)부터 시작
(function init() {
  if (location.hash) { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
  setTheme("game", true);
})();
</script>
